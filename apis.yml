name: ipify
description: >-
  ipify operates two complementary IP APIs. The free Public IP Address API (api.ipify.org, api6.ipify.org,
  api64.ipify.org) returns the caller's public IPv4, IPv6, or dual-stack address as plain text, JSON, or JSONP — with no
  authentication, no rate limit, and no logging. The paid IP Geolocation API (geo.ipify.org), operated by WhoisXML API,
  resolves an IP, domain, or email to a country/region/city, ISP, and Autonomous System (ASN) profile using
  credit-metered subscription plans.
