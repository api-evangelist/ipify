  - name: ipify IP Geolocation API
    description: >-
      Paid, credit-metered IP geolocation API operated by WhoisXML API. Resolves an IP, domain, or email to
      country/region/city, ISP, and AS (ASN) profile. Country (1 credit), Country+City (2 credits), and deprecated
      Country+City+VPN (3 credits) tiers. Authentication via `apiKey` query parameter.
    humanURL: https://geo.ipify.org/
    baseURL: https://geo.ipify.org/api/v2
    tags:
