apis:
  - name: ipify Public IP Address API
    description: >-
      Free, unauthenticated, unlimited public IP address lookup. Returns the caller's IPv4 (api.ipify.org), IPv6
      (api6.ipify.org), or dual-stack (api64.ipify.org) address as plain text, JSON, or JSONP.
    humanURL: https://www.ipify.org/
    baseURL: https://api.ipify.org
    tags:
      - IP Address
      - Public IP
      - Development
    properties:
